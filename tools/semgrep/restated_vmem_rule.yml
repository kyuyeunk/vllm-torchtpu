# Checked by tools/check_semgrep_baseline.py against
# tools/semgrep_baseline.txt.
rules:
  - id: restated-vmem-rule
    languages: [python]
    severity: ERROR
    message: >-
      An integer literal sized against vmem_capacity_bytes restates a kernel
      rule (often an element size, such as 4 for f32). Call the kernel's own
      admission predicate, or read the size from the dtype.
    patterns:
      - pattern-either:
          - pattern: $SIZE < $CAP
          - pattern: $SIZE <= $CAP
          - pattern: $SIZE > $CAP
          - pattern: $SIZE >= $CAP
          - pattern: $CAP < $SIZE
          - pattern: $CAP <= $SIZE
          - pattern: $CAP > $SIZE
          - pattern: $CAP >= $SIZE
      - metavariable-pattern:
          metavariable: $CAP
          pattern-either:
            - pattern: <... $OBJ.vmem_capacity_bytes ...>
            - pattern: <... vmem_capacity_bytes ...>
      - metavariable-pattern:
          metavariable: $SIZE
          patterns:
            - pattern-either:
                - pattern: <... $E * $N ...>
                - pattern: <... $N * $E ...>
            - metavariable-regex:
                metavariable: $N
                regex: ^\d+$
